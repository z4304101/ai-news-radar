name: GPU Rental Price Monitor

# Independent price monitoring: the original Get Hot News workflow is untouched.
on:
  schedule:
    # Aligned with Get Hot News: Beijing 08:25, 14:25, 20:25.
    - cron: "25 0,6,12 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gpu-rental-price.yml"
      - "trendradar/gpu_whole_machine_monitor.py"

permissions:
  contents: read

concurrency:
  group: gpu-rental-prices-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previously notified whole-machine prices
        uses: actions/cache@v4
        with:
          path: output/gpu_whole_prices/last_notified.sha256
          key: gpu-whole-prices-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gpu-whole-prices-${{ github.ref_name }}-

      - name: Fetch verified eight-card whole-machine monthly rental quotes
        env:
          GPU_WHOLE_OUTPUT: output/gpu_whole_prices
          # Schedule/manual runs notify; a single tagged push verifies Bark delivery.
          GPU_WHOLE_NOTIFY: 'false' # Enable only after genuine 8-card monthly quote and Bark verification
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python trendradar/gpu_whole_machine_monitor.py

      - name: Upload price table and source records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-whole-machine-monthly-prices
          path: output/gpu_whole_prices/
          if-no-files-found: warn
          retention-days: 14
