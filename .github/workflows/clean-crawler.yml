name: Check In (No Longer Required)

# Legacy compatibility workflow.
# The custom 7-day expiry/auto-disable mechanism has been removed from Get Hot News.
# This workflow is intentionally non-destructive and does not delete Actions history.
# Manual check-in is no longer required.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm check-in is no longer required
        run: |
          echo "The custom 7-day expiry has been removed from Get Hot News."
          echo "No manual check-in is required."
          echo "This legacy workflow does not delete workflow run history."
